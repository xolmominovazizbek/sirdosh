/* Layout: bitta ustun, telefon uchun; yagona yorqin element natijadagi suzani gulbargi. */
:root {
  --bg: #F3F5FB; --surface: #FFFFFF; --ink: #171C3F; --muted: #565D84; --line: #D8DDEE;
  --cobalt: #2438A6; --on-cobalt: #FFFFFF; --anor: #B4233F; --firuza: #0B7F86; --amber: #8F5A00;
  --tint: #E8ECF9; --urgent-bg: #FBE9EC; --warm-bg: #FAF1DF;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1330; --surface: #181D45; --ink: #EEF0FA; --muted: #A9AFD2; --line: #2E3568;
    --cobalt: #93A5FF; --on-cobalt: #10143A; --anor: #FF8097; --firuza: #55D2CB; --amber: #F2BC55;
    --tint: #222961; --urgent-bg: #3B1730; --warm-bg: #33291A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1330; --surface: #181D45; --ink: #EEF0FA; --muted: #A9AFD2; --line: #2E3568;
  --cobalt: #93A5FF; --on-cobalt: #10143A; --anor: #FF8097; --firuza: #55D2CB; --amber: #F2BC55;
  --tint: #222961; --urgent-bg: #3B1730; --warm-bg: #33291A; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
#app { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p, ul, ol { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: -0.005em; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.12; }
h2 { font-size: 24px; line-height: 1.2; }
h3 { font-size: 16px; font-weight: 600; line-height: 1.35; }
h1:focus, h2:focus { outline: none; }
a { color: var(--cobalt); }
.muted { color: var(--muted); }
.small { font-size: 14px; line-height: 1.45; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }

/* tugmalar */
button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  appearance: none; border: 0; border-radius: 10px; width: 100%;
  padding: 14px 16px; min-height: 50px; font-weight: 600; text-align: center;
  background: var(--cobalt); color: var(--on-cobalt);
}
.btn.ghost { background: transparent; color: var(--cobalt); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { appearance: none; background: none; border: 0; padding: 8px 0; color: var(--cobalt); font-weight: 600; text-align: left; }
:focus-visible { outline: 3px solid var(--firuza); outline-offset: 2px; }

/* boshlash */
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 20px; }
.brand svg { width: 28px; height: 28px; flex: none; }
.hero-rosette { width: 148px; align-self: center; }
.points { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.points li { padding-left: 16px; position: relative; font-size: 15px; }
.points li::before { content: ""; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; transform: rotate(45deg); background: var(--anor); }

/* savol */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--cobalt); transition: width .18s ease; }
.q-lead { color: var(--muted); font-size: 15px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
  appearance: none; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  border-radius: 10px; padding: 13px 14px; min-height: 52px; width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
}
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--cobalt); background: var(--tint); font-weight: 600; }
.pips { display: inline-flex; gap: 4px; flex: none; }
.pips b { width: 8px; height: 8px; transform: rotate(45deg); background: var(--line); }
.pips b.on { background: var(--cobalt); }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; }
.field input {
  font: 600 22px/1.2 var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%;
  font-variant-numeric: tabular-nums;
}
.err { color: var(--anor); font-size: 14px; min-height: 20px; }

/* natija */
.rosette-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rosette { width: 100%; max-width: 360px; }
.rosette text { fill: var(--muted); font: 600 13px var(--body); }
.rosette .ctr-num { fill: var(--ink); font: 700 44px var(--display); }
.rosette .ctr-sub { fill: var(--muted); font: 400 11px var(--body); }
.rosette .ctr { fill: var(--surface); stroke: var(--line); }
.ghost-petal { fill: var(--tint); stroke: var(--line); }
.ghost-petal.unrated { fill: none; stroke-dasharray: 3 4; }
.petal { transform-box: view-box; transform-origin: 190px 170px; animation: bloom .7s cubic-bezier(.2,.8,.2,1) both; }
.petal.good { fill: var(--firuza); } .petal.mid { fill: var(--cobalt); } .petal.low { fill: var(--anor); }
@keyframes bloom { from { transform: scale(.25); } to { transform: scale(1); } }
.verdict { font: 700 22px var(--display); }
.verdict.good { color: var(--firuza); } .verdict.mid { color: var(--cobalt); } .verdict.low { color: var(--anor); }
.domains { display: flex; flex-direction: column; gap: 10px; }
.domain { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 15px; }
.domain .val { font-variant-numeric: tabular-nums; font-weight: 600; }
.domain .bar { grid-column: 1 / -1; height: 6px; background: var(--tint); border-radius: 3px; overflow: hidden; }
.domain .bar i { display: block; height: 100%; }
.bar .good { background: var(--firuza); } .bar .mid { background: var(--cobalt); } .bar .low { background: var(--anor); }
.note { background: var(--tint); padding: 12px 14px; border-radius: 10px; font-size: 15px; }
.facts { display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.alert { background: var(--urgent-bg); padding: 14px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
.alert h3 { color: var(--anor); }
.private { background: var(--warm-bg); padding: 14px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
.section-head { display: flex; flex-direction: column; gap: 2px; }
.card { background: var(--surface); padding: 14px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.card .why { color: var(--muted); font-size: 14px; }
.card ul { padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
.evid { border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.grade { font-weight: 600; color: var(--ink); }
.grade.rct, .grade.guide { color: var(--firuza); } .grade.obs { color: var(--cobalt); } .grade.weak, .grade.practice { color: var(--amber); }
.refs a { margin-right: 8px; white-space: nowrap; }
details.more-box > summary { cursor: pointer; font: 700 20px var(--display); padding: 6px 0; }
details.more-box[open] > summary { margin-bottom: 10px; }

/* ---- apostroflarni to'g'rilash ---- */
function uzFix(s) {
  return s.replace(/([oOgG])'/g, "$1\u2018").replace(/'/g, "\u2019");
}
function deepFix(o) {
  if (typeof o === "string") return uzFix(o);
  if (Array.isArray(o)) return o.map(x => deepFix(x));
  if (o && typeof o === "object") {
    const r = {};
    for (const k of Object.keys(o)) r[k] = (k === "refs" || k === "id") ? o[k] : deepFix(o[k]);
    return r;
  }
  return o;
}

const TEXT = {
  SCALES: deepFix(SCALES), DOMAINS: deepFix(DOMAINS), CONTEXT_Q: deepFix(CONTEXT_Q), MOOD_Q: deepFix(MOOD_Q),
  LIFE_Q: deepFix(LIFE_Q), SAFETY_Q: deepFix(SAFETY_Q), URGENT: deepFix(URGENT), WHY: deepFix(WHY),
  GRADES: deepFix(GRADES), ADVICE: deepFix(ADVICE), SHARED_PLAN: deepFix(SHARED_PLAN), UI: deepFix(UI),
  FLAG_Q: deepFix(FLAG_Q), REFS
};

/* Sirdosh hisoblash qoidalari: UI'ga bog'liq emas, Node'da test qilinadi. */
const LOW = 50, GOOD = 75;

function band(v) { return v == null ? null : v >= GOOD ? "good" : v >= LOW ? "mid" : "low"; }

function fmt(t, vars) {
  return t.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] != null ? vars[k] : ""));
}

function domainsFor(sex) { return TEXT.DOMAINS[sex]; }

function scoreDomains(sex, a) {
  const active = a.active === "yes", partner = a.partner === "yes";
  return domainsFor(sex).map(d => {
    const applicable = d.needsPartner ? partner : (d.always || active);
    if (!applicable) return { id: d.id, label: d.label, score: null };
    const vals = d.items.map(i => a[i.id]);
    if (vals.some(v => typeof v !== "number")) return { id: d.id, label: d.label, score: null };
    const score = Math.round(vals.reduce((x, y) => x + y, 0) / (vals.length * 4) * 100);
    return { id: d.id, label: d.label, score };
  });
}

function bmiOf(a) {
  if (!a.height || !a.weight) return null;
  return Math.round(a.weight / Math.pow(a.height / 100, 2) * 10) / 10;
}

function has(list, v) { return Array.isArray(list) && list.includes(v); }

/* Savollar ketma-ketligi. Har bir qadam javoblarga qarab aniqlanadi. */
function buildSteps(sex, a) {
  const c = TEXT.CONTEXT_Q, l = TEXT.LIFE_Q, steps = [];
  const add = (id, q) => steps.push(Object.assign({ id }, q));
  add("age", c.age);
  add("partner", c.partner);
  add("active", c.active);
  if (a.active === "no") add("whyNot", c.whyNot);
  if (sex === "f") add("fstage", c.fstage);
  const active = a.active === "yes", partner = a.partner === "yes";
  domainsFor(sex).forEach(d => {
    const on = d.needsPartner ? partner : (d.always || active);
    if (on) d.items.forEach(i => add(i.id, { type: "scale", section: "Jinsiy funksiya", text: i.text, scale: i.scale, domain: d.label }));
  });
  add("distress", c.distress);
  if (sex === "m" && active) {
    const ds = scoreDomains(sex, a), ere = ds.find(x => x.id === "ere").score, eja = ds.find(x => x.id === "eja").score;
    if (ere != null && ere < GOOD) { add("monset", c.monset); add("mmorning", c.mmorning); }
    if (eja != null && eja < GOOD) add("mpe", c.mpe);
  }
  TEXT.MOOD_Q.items.forEach(i => add(i.id, { type: "scale", section: "Kayfiyat", lead: TEXT.MOOD_Q.intro, text: i.text, scale: "mood" }));
  ["body", "activity", "sleep", "snore", "tobacco", "alcohol", "cond", "meds", "enhancer"].forEach(k => add(k, l[k]));
  add("flags", { type: "multi", section: "Salomatlik", text: TEXT.UI.flagsQ, options: TEXT.FLAG_Q[sex] });
  add("safety", TEXT.SAFETY_Q);
  return steps;
}

function evaluate(sex, a) {
  const domains = scoreDomains(sex, a);
  const s = id => { const d = domains.find(x => x.id === id); return d ? d.score : null; };
  const lowish = id => s(id) != null && s(id) < GOOD;
  const low = id => s(id) != null && s(id) < LOW;
  const rated = domains.filter(d => d.score != null);
  const index = rated.length >= 4 ? Math.round(rated.reduce((x, d) => x + d.score, 0) / rated.length) : null;
  const distress = typeof a.distress === "number" ? a.distress : 0;
  const phq = (a.phq1 || 0) + (a.phq2 || 0), gad = (a.gad1 || 0) + (a.gad2 || 0);
  const bmi = bmiOf(a);
  const flags = a.flags || [], meds = a.meds || [], cond = a.cond || [];
  const W = TEXT.WHY, U = TEXT.UI;
  const card = (id, why, weight) => ({ id, why, weight });
  const doctor = [], self = [], privateCards = [];
  const urgent = ["chest", "cauda", "priapism"].filter(f => has(flags, f));

  if (a.safety === "yes") privateCards.push(card("coercion", W.coercion, 100));

  /* Shifokor kartalari */
  if (has(meds, "nitrate")) doctor.push(card("nitrate", W.nitrate, 95));
  if (has(flags, "bleed") || has(flags, "pmb")) doctor.push(card("gyn_bleed", W.flag, 92));
  if (has(flags, "pelvicpain")) doctor.push(card("gyn_pain", W.flag, 91));
  if (has(flags, "curve") || has(flags, "testis")) doctor.push(card("uro_flag", W.flag, 90));
  if (has(flags, "sti")) doctor.push(card("sti", W.flag, 89));
  if (a.alcohol === "daily") doctor.push(card("alcohol_doc", W.alcoholDaily, 85));
  if (phq >= 3) doctor.push(card("dep", fmt(W.phq, { v: phq }), 84));
  if (gad >= 3) doctor.push(card("anx", fmt(W.gad, { v: gad }), 80));
  if (has(meds, "ad") && (distress >= 1 || rated.some(d => d.score < GOOD))) doctor.push(card("meds", W.ad, 78));
  else if ((has(meds, "bp") || has(meds, "other")) && distress >= 2) doctor.push(card("meds", W.meds, 60));
  if (a.enhancer === "yes") doctor.push(card("supp", W.enhancer, 76));

  if (sex === "m") {
    if (lowish("ere")) doctor.push(card("cardio", fmt(W.ereLow, { v: s("ere") }), 82));
    if (a.monset === "sudden") doctor.push(card("sudden", W.sudden, 81));
    if (low("ere") || (lowish("ere") && distress >= 2)) doctor.push(card("ed_doc", fmt(W.ereLow, { v: s("ere") }), 72));
    if (low("des") && (a.mmorning === "none" || a.mmorning === "less")) doctor.push(card("testo", W.morning, 70));
    if (a.mpe === "lifelong" && distress >= 2) doctor.push(card("pe_doc", W.lifelong, 68));
    if (a.mpe === "acquired") doctor.push(card("pe_doc", W.acquired, 68));
  }
  if (sex === "f") {
    const dry = lowish("aro") || lowish("pain") || a.whyNot === "pain";
    if ((a.fstage === "peri" || a.fstage === "meno") && dry) doctor.push(card("gsm", fmt(W.stage, { what: U.stageWhat[a.fstage] }), 74));
    if (low("pain") || a.whyNot === "pain") doctor.push(card("pain_pelvic", low("pain") ? fmt(W.painLow, { v: s("pain") }) : W.painReason, 77));
  }
  if (sex === "m" && a.whyNot === "pain") doctor.push(card("uro_flag", W.painReason, 77));
  if (a.snore === "yes") doctor.push(card("osa", W.snore, 58));

  /* O'zi bajaradigan kartalar */
  const lowActivity = a.activity === "a0" || a.activity === "a1";
  if (lowActivity) self.push(card(sex === "m" ? "exercise_m" : "exercise_f", W.activityLow, sex === "m" && lowish("ere") ? 80 : 50));
  if (bmi != null && bmi >= 25) self.push(card("weight", fmt(W.bmi, { bmi: String(bmi).replace(".", ",") }), bmi >= 30 ? 66 : 48));
  if (a.tobacco && a.tobacco !== "no") self.push(card("tobacco", fmt(W.tobacco, { what: U.tobaccoWhat[a.tobacco] }), 70));
  if (a.alcohol === "weekly") self.push(card("alcohol", W.alcoholWeekly, 46));
  if (a.alcohol === "daily") self.push(card("alcohol", W.alcoholDaily, 72));
  if (a.sleep === "s0") self.push(card("sleep", W.sleepShort, 55));
  if (a.sleep === "s1") self.push(card("sleep", W.sleepShort, 34));
  if (sex === "m") {
    if (lowish("eja")) self.push(card("pe_behav", fmt(W.ejaLow, { v: s("eja") }), 68));
    if (lowish("ere") || lowish("eja")) self.push(card("pfmt_m", lowish("ere") ? fmt(W.ereLow, { v: s("ere") }) : fmt(W.ejaLow, { v: s("eja") }), 30));
    if (lowish("ere") || a.whyNot === "fear" || a.monset === "situational") {
      const why = a.whyNot === "fear" ? W.fear : a.monset === "situational" ? W.situational : gad >= 3 ? fmt(W.gad, { v: gad }) : null;
      if (why) self.push(card("perf", why, 64));
    }
    if (lowish("ere") && a.enhancer !== "yes") self.push(card("supp", W.supp, 16));
    if (lowish("ere") || (bmi != null && bmi >= 25)) self.push(card("diet", W.ereDiet, 22));
  }
  if (sex === "f") {
    const painful = low("pain") || a.whyNot === "pain";
    if ((lowish("aro") || lowish("pain") || a.fstage === "peri" || a.fstage === "meno") && (a.active === "yes" || a.whyNot === "pain"))
      self.push(card("lube", lowish("aro") ? fmt(W.aroLow, { v: s("aro") }) : lowish("pain") ? fmt(W.painLow, { v: s("pain") }) : fmt(W.stage, { what: U.stageWhat[a.fstage] }), 69));
    if (a.fstage === "postpartum") self.push(card("postpartum", fmt(W.stage, { what: U.stageWhat.postpartum }), 52));
    if (!painful && (lowish("org") || lowish("aro"))) self.push(card("pfmt_f", lowish("org") ? fmt(W.orgLow, { v: s("org") }) : fmt(W.aroLow, { v: s("aro") }), 38));
    if (lowish("des") || distress >= 2) self.push(card("mindful", lowish("des") ? fmt(W.desLow, { v: s("des") }) : W.distress, 67));
    if (a.whyNot === "fear") self.push(card("perf", W.fear, 60));
    if (distress >= 2 && rated.some(d => d.score < GOOD)) self.push(card("counsel", W.distress, 47));
  }
  if (lowish("rel")) self.push(card("talk", fmt(W.relLow, { v: s("rel") }), 63));
  else if (a.partner === "yes" && (lowish("ere") || lowish("eja"))) self.push(card("talk", W.distress, 33));

  const uniq = list => {
    const seen = {};
    return list.sort((x, y) => y.weight - x.weight).filter(c => (seen[c.id] ? false : (seen[c.id] = true)));
  };
  const dList = uniq(doctor), sList = uniq(self).filter(c => !dList.some(d => d.id === c.id));
  if (!sList.length && !dList.length) sList.push(card("maintain", W.maintain, 1));

  const anyLow = rated.some(d => d.score < GOOD);
  const note = anyLow && distress <= 1 ? "distressLow" : distress >= 2 ? "distressHigh" : null;
  return {
    sex, domains, index, band: band(index), distress, phq, gad, bmi, urgent, doctor: dList,
    plan: sList.slice(0, 3), more: sList.slice(3), privateCards, note, age: a.age, whyNot: a.whyNot || null
  };
}

function doctorSummary(r, today) {
  const L = [];
  L.push("Sirdosh skrining xulosasi (" + today + "). Tashxis emas.");
  L.push((r.sex === "m" ? "Erkak" : "Ayol") + ", " + r.age + " yosh." + (r.bmi ? " TMI " + String(r.bmi).replace(".", ",") + "." : ""));
  r.domains.forEach(d => L.push(d.label + ": " + (d.score == null ? "baholanmadi" : d.score + "/100")));
  L.push("Bezovtalik: " + r.distress + "/4.");
  L.push("PHQ-2: " + r.phq + "; GAD-2: " + r.gad + ".");
  const items = r.urgent.map(u => TEXT.URGENT[u].title).concat(r.doctor.map(d => TEXT.ADVICE[d.id].title));
  if (items.length) L.push("Muhokama uchun: " + items.join("; ") + ".");
  return L.join("\n");
}

/* --- gulbarg --- */
function petalPath(l, w) {
  return "M0,0 C" + w + "," + (-l * .32) + " " + w + "," + (-l * .78) + " 0," + (-l) +
    " C" + (-w) + "," + (-l * .78) + " " + (-w) + "," + (-l * .32) + " 0,0Z";
}
function emblem() {
  let p = "";
  for (let i = 0; i < 6; i++) p += '<path d="' + petalPath(46, 15) + '" transform="translate(50 50) rotate(' + i * 60 + ')" fill="var(--cobalt)"/>';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' + p + '<circle cx="50" cy="50" r="9" fill="var(--anor)"/></svg>';
}
function rosette(r) {
  const cx = 190, cy = 170, max = 122, min = 42, n = r.domains.length;
  let ghosts = "", petals = "", labels = "";
  r.domains.forEach((d, i) => {
    const ang = i * 360 / n, rad = (ang - 90) * Math.PI / 180;
    const rated = d.score != null;
    ghosts += '<path class="ghost-petal' + (rated ? "" : " unrated") + '" d="' + petalPath(max, 37) + '" transform="translate(' + cx + " " + cy + ") rotate(" + ang + ')"/>';
    if (rated) {
      const l = min + (max - min) * d.score / 100;
      petals += '<g class="petal ' + band(d.score) + '" style="animation-delay:' + i * 50 + 'ms"><path d="' + petalPath(l, 37 * Math.max(.55, l / max)) + '" transform="translate(' + cx + " " + cy + ") rotate(" + ang + ')"/></g>';
    }
    const lx = cx + Math.cos(rad) * (max + 14), ly = cy + Math.sin(rad) * (max + 14) + 4;
    const anchor = Math.abs(Math.cos(rad)) < .1 ? "middle" : Math.cos(rad) > 0 ? "start" : "end";
    labels += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(d.label) + "</text>";
  });
  const num = r.index == null ? "–" : r.index;
  const desc = r.domains.map(d => d.label + " " + (d.score == null ? U.notRated : d.score)).join(", ");
  return '<svg class="rosette" viewBox="0 0 380 340" role="img" aria-label="' + esc(desc) + '">' + ghosts + petals +
    '<circle class="ctr" cx="' + cx + '" cy="' + cy + '" r="42"/>' +
    '<text class="ctr-num" x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle">' + num + "</text>" +
    '<text class="ctr-sub" x="' + cx + '" y="' + (cy + 27) + '" text-anchor="middle">' + esc(U.indexLabel) + "</text>" + labels + "</svg>";
}

      '<p class="muted small">' + esc(second ? U.handoffText : U.whoHint) + "</p>" +
      '<div class="options"><button class="opt" data-sex="m">' + esc(U.man) + '</button><button class="opt" data-sex="f">' + esc(U.woman) + "</button>" +
      (S.couple ? "" : '<button class="opt" data-couple="1">' + esc(U.couple) + "</button>") + "</div>";
  },
  q() {
    const steps = buildSteps(S.sex, S.a), i = steps.findIndex(s => s.id === S.stepId), q = steps[i];
    const pct = Math.round(i / steps.length * 100);
    let body = "";
    if (q.type === "scale") {
      const labels = TEXT.SCALES[q.scale];
      body = '<div class="options">' + labels.map((l, v) => optBtn(l, v, S.a[q.id] === v, pips(v, labels.length))).join("") + "</div>";
    } else if (q.type === "single") {
      body = '<div class="options">' + q.options.map(o => optBtn(o[1], o[0], S.a[q.id] === o[0])).join("") + "</div>";
    } else if (q.type === "multi") {
      const cur = S.a[q.id] || [];
      body = '<div class="options">' + q.options.map(o => '<button class="opt" data-toggle="' + o[0] + '" aria-pressed="' + cur.includes(o[0]) + '">' + esc(o[1]) + "</button>").join("") + "</div>" +
        '<button class="btn" data-next="1"' + (cur.length ? "" : " disabled") + ">" + esc(U.next) + "</button>";
    } else if (q.type === "number") {
      body = '<label class="field" for="f-num">' + esc(q.unit) + '<input id="f-num" type="number" inputmode="numeric" min="' + q.min + '" max="' + q.max + '" value="' + esc(S.a[q.id] || "") + '"></label>' +
        '<p class="err" role="alert">' + esc(S.err) + '</p><button class="btn" data-next="1">' + esc(U.next) + "</button>";
    } else if (q.type === "body") {
      body = '<label class="field" for="f-h">' + esc(U.height) + '<input id="f-h" type="number" inputmode="numeric" value="' + esc(S.a.height || "") + '"></label>' +
        '<label class="field" for="f-w">' + esc(U.weight) + '<input id="f-w" type="number" inputmode="decimal" value="' + esc(S.a.weight || "") + '"></label>' +
        '<p class="err" role="alert">' + esc(S.err) + '</p><button class="btn" data-next="1">' + esc(U.next) + "</button>";
    }
    return '<div class="topbar"><button class="link" data-back="1">' + esc(U.back) + '</button><span class="small muted">' + esc(q.section) + "</span></div>" +
      '<div class="track" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div>' +
      '<div class="stack">' + (q.lead ? '<p class="q-lead">' + esc(q.lead) + "</p>" : "") + '<h2 tabindex="-1">' + esc(q.text) + "</h2>" + (q.hint ? '<p class="muted small">' + esc(q.hint) + "</p>" : "") + "</div>" + body;
  },
  underage() {
    return '<h2 tabindex="-1">' + esc(U.underage) + '</h2><button class="btn ghost" data-home="1">' + esc(U.backHome) + "</button>";
  },
  result() {
    const r = S.result;
    const last = S.couple ? null : readHist().filter(x => x.sex === r.sex).slice(-1)[0];
    const delta = last && r.index != null && last.index != null ? fmt(U.delta, { d: (r.index - last.index > 0 ? "+" : "") + (r.index - last.index), date: last.date }) : "";
    const bandName = { good: U.bandGood, mid: U.bandMid, low: U.bandLow };
    let h = "";
    if (r.privateCards.length) h += r.privateCards.map(privateCard).join("");
    if (r.urgent.length) h += '<section class="stack"><h2>' + esc(U.urgent) + "</h2>" +
      r.urgent.map(k => '<div class="alert"><h3>' + esc(TEXT.URGENT[k].title) + "</h3><p>" + esc(TEXT.URGENT[k].text) + "</p></div>").join("") + "</section>";
    h += '<section class="rosette-wrap"><h2 tabindex="-1">' + esc(U.profile) + "</h2>" + rosette(r) +
      (r.band ? '<p class="verdict ' + r.band + '">' + esc(bandName[r.band]) + "</p>" : "") +
      '<p class="small muted" style="text-align:center">' + esc(r.index == null ? U.noIndex : U.indexNote) + "</p>" +
      (delta ? '<p class="small">' + esc(delta) + "</p>" : "") + "</section>";
    h += '<section class="domains">' + r.domains.map(d => {
      const b = band(d.score);
      return '<div class="domain"><span>' + esc(d.label) + '</span><span class="val">' + (d.score == null ? '<span class="muted small">' + esc(U.notRated) + "</span>" : d.score) + "</span>" +
        '<div class="bar">' + (b ? '<i class="' + b + '" style="width:' + d.score + '%"></i>' : "") + "</div></div>";
    }).join("") + "</section>";
    if (r.note) h += '<p class="note">' + esc(r.note === "distressLow" ? U.distressLowNote : U.distressHighNote) + "</p>";
    h += '<div class="facts"><span>' + esc(fmt(U.moodLine, { phq: r.phq, gad: r.gad })) + "</span>" + (r.bmi ? "<span>" + esc(fmt(U.bmiLine, { bmi: String(r.bmi).replace(".", ",") })) + "</span>" : "") + "</div>";
    if (r.whyNot === "nopartner") h += '<p class="note">' + esc(TEXT.WHY.nopartner) + "</p>";
    if (r.doctor.length) h += '<section class="stack"><div class="section-head"><h2>' + esc(U.doctor) + '</h2><p class="small muted">' + esc(U.doctorHint) + "</p></div>" + r.doctor.map(adviceCard).join("") + "</section>";
    if (r.plan.length) h += '<section class="stack"><div class="section-head"><h2>' + esc(U.plan) + '</h2><p class="small muted">' + esc(U.planHint) + "</p></div>" + r.plan.map(adviceCard).join("") + "</section>";
    if (r.more.length) h += '<details class="more-box"><summary>' + esc(U.more) + '</summary><div class="stack">' + r.more.map(adviceCard).join("") + "</div></details>";
    h += '<section class="stack"><div class="section-head"><h2>' + esc(U.summary) + '</h2><p class="small muted">' + esc(U.summaryHint) + '</p></div><div class="summary-box" id="summary">' + esc(doctorSummary(r, today())) + "</div>" +
      '<button class="btn ghost" data-copy="1">' + esc(U.copy) + "</button>" + (S.couple ? "" : '<button class="btn ghost" data-save="1">' + esc(U.save) + "</button>") + '<p class="status" role="status">' + esc(S.status) + "</p></section>";
    if (S.couple && S.turn === 0) h += '<button class="btn" data-handoff="1">' + esc(U.handoff) + "</button>";
    else if (S.couple) h += '<button class="btn" data-shared="1">' + esc(U.next2) + "</button>";
    else h += '<div class="stack"><button class="btn ghost" data-home="1">' + esc(U.again) + '</button><button class="btn ghost" data-go="sources">' + esc(U.sources) + "</button></div>";
    h += '<p class="foot">' + esc(U.emergency) + "</p>";
    return h;
  },
  shared() {
    return '<h2 tabindex="-1">' + esc(U.sharedTitle) + '</h2><p class="muted">' + esc(U.sharedLead) + "</p>" +
      '<div class="stack">' + TEXT.SHARED_PLAN.map(p => '<article class="card"><h3>' + esc(p.title) + "</h3><p>" + esc(p.text) + "</p></article>").join("") + "</div>" +
      '<button class="btn ghost" data-home="1">' + esc(U.again) + "</button>";
  },
  sources() {
    return '<div class="topbar"><button class="link" data-back="1">' + esc(S.result && !S.couple ? U.backResult : U.backHome) + "</button></div>" +
      '<h2 tabindex="-1">' + esc(U.methodTitle) + '</h2><div class="stack">' + U.method.map(p => "<p>" + esc(p) + "</p>").join("") + "</div>" +
      "<h2>" + esc(U.dataTitle) + "</h2><p>" + esc(U.data) + '</p><button class="btn ghost" data-wipe="1">' + esc(U.wipe) + '</button><p class="status" role="status">' + esc(S.status) + "</p>" +
      "<h2>" + esc(U.refsTitle) + '</h2><ol class="reflist">' + Object.keys(TEXT.REFS).map(k => '<li>' + esc(TEXT.REFS[k][0]) + ' <a href="' + esc(refUrl(k)) + '" target="_blank" rel="noopener">' + esc(TEXT.REFS[k][1] ? "DOI" : "Havola") + "</a></li>").join("") + "</ol>";
  }
};

function optBtn(label, value, on, extra) {
  return '<button class="opt" data-val="' + esc(value) + '" aria-pressed="' + !!on + '"><span>' + esc(label) + "</span>" + (extra || "") + "</button>";
}
function pips(v, n) {
  let s = '<span class="pips" aria-hidden="true">';
  for (let i = 1; i < n; i++) s += "<b" + (i <= v ? ' class="on"' : "") + "></b>";
  return s + "</span>";
}

function render() {
  $app.innerHTML = screens[S.screen]();
  window.scrollTo(0, 0);
  const h = $app.querySelector("[tabindex='-1']");
  if (h) h.focus({ preventScroll: true });
  if (tg && tg.BackButton) {
    const showBack = S.screen === "q" || S.screen === "sources" || S.screen === "who";
    try { showBack ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) { /* eski versiya */ }
  }
}

/* --- oqim --- */
function startFlow(sex) {
  S.sex = sex; S.a = {}; S.hist = []; S.err = ""; S.status = ""; S.result = null;
  S.stepId = "age"; S.screen = "q"; render();
}
function next() {
  const steps = buildSteps(S.sex, S.a), i = steps.findIndex(s => s.id === S.stepId);
  S.err = "";
  if (i + 1 >= steps.length) {
    S.result = evaluate(S.sex, S.a); S.screen = "result"; S.hist = []; render(); return;
  }
  S.hist.push(S.stepId); S.stepId = steps[i + 1].id; render();
}
function goBack() {
  if (S.screen === "q") {
    if (S.hist.length) { S.stepId = S.hist.pop(); S.err = ""; render(); return; }
    S.screen = "who"; render(); return;
  }
  if (S.screen === "who") { if (S.couple && S.turn === 1) return; S.couple = false; S.screen = "welcome"; render(); return; }
  if (S.screen === "sources") { S.status = ""; S.screen = S.result && !S.couple ? "result" : "welcome"; render(); }
}
function home() { Object.assign(S, { screen: "welcome", sex: null, couple: false, turn: 0, a: {}, stepId: null, hist: [], result: null, err: "", status: "" }); render(); }

function setStatus(t) { S.status = t; const el = $app.querySelector(".status"); if (el) el.textContent = t; }

$app.addEventListener("click", ev => {
  const b = ev.target.closest("button, a");
  if (!b) return;
  if (b.tagName === "A") {
    if (tg && tg.openLink) { ev.preventDefault(); tg.openLink(b.href); }
    return;
  }
  const d = b.dataset;
  if (d.go) { S.status = ""; S.screen = d.go; render(); }
  else if (d.home) home();
  else if (d.back) goBack();
  else if (d.sex) startFlow(d.sex);
  else if (d.couple) { S.couple = true; S.turn = 0; render(); }
  else if (d.val !== undefined) {
    const q = buildSteps(S.sex, S.a).find(s => s.id === S.stepId);
    S.a[q.id] = q.type === "scale" ? Number(d.val) : d.val;
    next();
  } else if (d.toggle) {
    const q = S.stepId; let cur = S.a[q] || [];
    if (d.toggle === "none") cur = cur.includes("none") ? [] : ["none"];
    else { cur = cur.filter(x => x !== "none"); cur = cur.includes(d.toggle) ? cur.filter(x => x !== d.toggle) : cur.concat(d.toggle); }
    S.a[q] = cur; render();
  } else if (d.next) {
    const q = buildSteps(S.sex, S.a).find(s => s.id === S.stepId);
    if (q.type === "number") {
      const v = Number(document.getElementById("f-num").value);
      if (v > 0 && v < q.min) { S.a = {}; S.screen = "underage"; S.couple = false; render(); return; }
      if (!v || v > q.max) { S.err = fmt(U.invalid, { min: q.min, max: q.max }); render(); return; }
      S.a[q.id] = v;
    } else if (q.type === "body") {
      const h = Number(document.getElementById("f-h").value), w = Number(document.getElementById("f-w").value);
      if (!(h >= 120 && h <= 230 && w >= 35 && w <= 250)) { S.a.height = h || ""; S.a.weight = w || ""; S.err = U.invalidBody; render(); return; }
      S.a.height = h; S.a.weight = w;
    }
    next();
  } else if (d.copy) {
    const text = document.getElementById("summary").textContent;
    const fail = () => {
      setStatus(U.copyFail);
      const r = document.createRange(); r.selectNodeContents(document.getElementById("summary"));
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => setStatus(U.copied), fail);
    else fail();
  } else if (d.save) {
    const r = S.result, l = readHist();
    l.push({ date: today(), sex: r.sex, index: r.index, domains: r.domains.map(x => [x.id, x.score]), distress: r.distress });
    setStatus(writeHist(l.slice(-12)) ? U.saved : U.saveFail);
  } else if (d.wipe) {
    setStatus(wipeHist() ? U.wiped : U.saveFail);
  } else if (d.handoff) {
    S.a = {}; S.result = null; S.sex = null; S.turn = 1; S.status = ""; S.screen = "who"; render();
  } else if (d.shared) {
    S.a = {}; S.result = null; S.status = ""; S.screen = "shared"; render();
  }
});

/* --- Telegram --- */
function applyTheme() {
  if (!tg) return;
  document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try {
    if (tg.isVersionAtLeast && tg.isVersionAtLeast("6.1")) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
  } catch (e) { /* eski versiya */ }
}
if (tg) {
  tg.ready();
  tg.expand();
  applyTheme();
  tg.onEvent("themeChanged", applyTheme);
  try { tg.BackButton.onClick(goBack); } catch (e) { /* eski versiya */ }
}
render();

</script>
</body>
</html>
